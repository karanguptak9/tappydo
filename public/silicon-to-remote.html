<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="description" content="Silicon to Remote: follow one TV remote button press from the batteries to the TV turning on."><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{height:100%}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Silicon to Remote</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: same system as Sand to Silicon. One centred card on a soft pastel ground; the dark viewport is the focus. */
:root{
  color-scheme:light;
  --bg:#f1eefc; --panel:#ffffff; --ink:#2a2d4f; --muted:#62678c; --line:#dfe1f3;
  --p1:#c0700c; --p2:#6a3bf2; --p3:#0b8f63; --accent:#c2267f; --duv:#1f6fe0;
  --good:#0f9a68; --goodbg:#d8f6e7; --warn:#9a5b00; --warnbg:#fff0cc; --bad:#d12a4b; --on:#ffffff;
  --scope:#0e1233;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,#fffbeb 0%,#ffffff 100%) fixed #fffbeb;color:var(--ink);font:18px/1.5 var(--body);padding-inline:16px;padding-block:20px 56px;min-height:100%}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:stretch}
header{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
h1{font:800 clamp(30px,6vw,44px)/1 var(--display);margin:0;letter-spacing:-.02em}
h1 span:nth-child(1){color:var(--p1)} h1 span:nth-child(2){color:var(--p2)} h1 span:nth-child(3){color:var(--p3)}
h2{font:800 clamp(24px,4.5vw,32px)/1.15 var(--display);margin:0;text-wrap:balance}
h3{font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.lede{color:var(--muted);max-width:56ch;margin:0 auto;text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 18px;font-weight:600;font-size:16px}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.view{display:flex;flex-direction:column;gap:16px}
[data-ph="0"]{--ph:var(--p1)} [data-ph="1"]{--ph:var(--p2)} [data-ph="2"]{--ph:var(--p3)}

/* build */
.card{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding:24px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.st{width:36px;height:36px;border-radius:50%;border:2px solid var(--ph);background:transparent;color:var(--ph);font:500 14px var(--mono);padding:0}
.st.good{background:var(--goodbg);border-color:var(--good);color:var(--good)}
.st[aria-current="true"]{background:var(--ph);border-color:var(--ph);color:var(--on);transform:scale(1.15)}
.head{display:flex;flex-direction:column;gap:8px;align-items:center}
.tag{font:600 14px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ph)}
.ask{font-size:20px;font-weight:500;max-width:36ch;text-wrap:balance}
.frame{position:relative;width:100%;max-width:640px;border:6px solid var(--line);border-radius:22px;overflow:hidden;transition:border-color .2s}
.frame.good{border-color:var(--good)}
canvas{display:block;width:100%;aspect-ratio:640/300;background:var(--scope)}
.badge{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;background:var(--good);color:#fff;font:800 28px/48px var(--display);text-align:center}
.ctl{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px;align-items:center}
.val{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.val.good{color:var(--good)}
.lab{font-weight:600;color:var(--muted)}
.sl{display:flex;gap:12px;align-items:center;width:100%}
.pm{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font:800 30px/1 var(--display)}
.track{position:relative;flex:1;min-width:0;height:56px}
.rail{position:absolute;left:22px;right:22px;top:21px;height:14px;border-radius:7px;background:var(--line)}
.zone{position:absolute;top:-5px;height:24px;border-radius:8px;background:var(--goodbg);border:2px solid var(--good)}
.track input{position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.track input::-webkit-slider-runnable-track{background:transparent;height:56px}
.track input::-moz-range-track{background:transparent;height:56px}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:var(--th,var(--ink));border:4px solid #fff;box-shadow:0 2px 8px #2a2d4f55;margin-top:6px}
.track input::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:var(--th,var(--ink));border:4px solid #fff;box-shadow:0 2px 8px #2a2d4f55}
.track.good{--th:var(--good)}
.zl{font-size:15px;color:var(--good);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{border:3px solid var(--line);background:var(--panel);border-radius:16px;padding:14px 20px;font-weight:600;min-height:60px}
.opt[aria-pressed="true"]{border-color:var(--warn);background:var(--warnbg)}
.opt.right[aria-pressed="true"]{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.status{width:100%;max-width:640px;border-radius:16px;padding:14px 18px;background:var(--warnbg);color:var(--ink);border:2px solid transparent}
.status b{display:block;font:800 22px/1.2 var(--display);color:var(--warn)}
.status.good{background:var(--goodbg);border-color:var(--good)} .status.good b{color:var(--good)}
.nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.go{border:0;border-radius:16px;background:var(--ink);color:#fff;padding:14px 28px;font-weight:600;min-height:56px}
.go.ready{background:var(--good)}
.ghost{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 20px;font-weight:500;min-height:48px}
.ghost:disabled{opacity:.4;cursor:default}
.what{max-width:58ch;color:var(--muted)}
details{width:100%;max-width:640px;text-align:left;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;text-align:center}
#info{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.fact b{font:800 28px/1.1 var(--display);color:var(--ph);overflow-wrap:anywhere;display:block}
.fact span,.who{color:var(--muted)}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;text-align:left}
.fn{display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--c);padding-top:8px;min-width:0}
.fn b{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.fn span{color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:14px}
.fix{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* play */
.sub{font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--p2)}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center;background:#3a3f5c;padding:18px;border-radius:30px}
.rb{height:56px;border-radius:16px;border:0;background:#59607f;color:#fff;font-weight:700;font-size:16px}
.rb.pw{background:#e0465e}
.rb:active{transform:scale(.95)}
.pctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px;width:100%;max-width:640px;text-align:left;align-items:center}
.knob{display:flex;flex-direction:column;gap:6px}
.knob label{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.knob output{font:500 15px var(--mono)}
.knob input{width:100%;accent-color:var(--p2)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600}
.funnel{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.funnel{grid-template-columns:minmax(0,1fr)}.pad{grid-template-columns:repeat(3,72px)}.card{padding:16px}.pm{width:48px;height:48px}.val{font-size:34px}}
@media (prefers-reduced-motion:reduce){.frame,.st{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="tabs">
      <button class="tab" id="tab-build" aria-pressed="true">Step by step</button>
      <button class="tab" id="tab-play" aria-pressed="false">Use the remote</button>
    </div>
  </header>

  <section class="view" id="view-build">
    <div class="card" id="card">
      <div class="dots" id="phases"></div>
      <div class="head"><span class="tag" id="tag"></span><h2 id="name"></h2><p class="ask" id="ask"></p></div>
      <div class="frame" id="frame"><canvas id="cv" role="img" aria-label="Animated view of the current step"></canvas><div class="badge" id="badge" hidden>✓</div></div>
      <div class="ctl" id="ctl"></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="nav"><button class="ghost" id="back">← Back</button><button class="go" id="next">Next step →</button></div>
      <div class="tabs" role="group" aria-label="How to explain this step"><button class="tab" id="m-std" aria-pressed="true">Explain it</button><button class="tab kidbtn" id="m-kid" aria-pressed="false">Learn it like a kid</button></div>
      <p class="what" id="what"></p>
      <div class="fact" id="info"></div>
    </div>
    <div class="card" id="results" hidden>
      <h2>How your remote turned out</h2>
      <div class="funnel" id="funnel"></div>
      <p class="note" id="fnote"></p>
      <div class="fix" id="fix"></div>
      <button class="go ready" id="to-play">Try it in "Use the remote" →</button>
    </div>
  </section>

  <section class="view" id="view-play" hidden>
    <div class="card">
      <div class="head"><span class="tag" style="--ph:var(--p2)">Free play</span><h2>Use the remote</h2><p class="ask">Press the buttons. Then move further away, run the battery down, or put your hand in the way.</p></div>
      <div class="frame" id="pframe"><canvas id="cv2" role="img" aria-label="A remote and a TV in a room"></canvas></div>
      <div class="pad" role="group" aria-label="Remote buttons">
        <button class="rb pw" data-b="power">Power</button><button class="rb" data-b="chup">Ch +</button><button class="rb" data-b="volup">Vol +</button>
        <span></span><button class="rb" data-b="chdn">Ch −</button><button class="rb" data-b="voldn">Vol −</button>
      </div>
      <div class="status" id="pstatus" role="status" aria-live="polite"><b>Press Power to start</b>Each press sends a code made of 1s and 0s.</div>
      <div class="pctl">
        <div class="knob"><label for="p-dist">Distance to the TV<output id="o-dist"></output></label><input type="range" id="p-dist" min="1" max="9" step="0.5" value="3"></div>
        <div class="knob"><label for="p-batt">Battery left<output id="o-batt"></output></label><input type="range" id="p-batt" min="0" max="100" step="5" value="80"></div>
        <label class="chk"><input type="checkbox" id="p-hand"> Hand in the way</label>
      </div>
      <p class="note" id="pnote"></p>
    </div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const PH=['Phase 1 · Inside the remote','Phase 2 · Through the air','Phase 3 · Inside the TV'];
const S=(label,unit,min,max,step,start,ideal,tol,low,high)=>({type:'slider',label,unit,min,max,step,start,ideal,tol,low,high});
const CODES={power:'01000101',volup:'01000110',voldn:'00010101',chup:'01000000',chdn:'01000100'};
const STEPS=[
{ph:0,id:'battery',name:'Put in the batteries',
 what:'The chip inside a remote is a microcontroller: a tiny computer with its own memory. It needs a steady supply of power. Most remotes run on two AA batteries in a row, which add up to 3 volts.',
 tip:'Two AA batteries give 3 volts. Slide to 3.0 V.',fact:['1.5 V','from each AA battery, so two in a row give 3 V'],
 ctl:S('Battery voltage','V',0.5,6,0.1,1.5,3,0.3,'Too weak. The chip cannot stay awake and keeps restarting.','Too strong. More voltage than the chip is built for can burn it out.')},
{ph:0,id:'firmware',name:'Load the program',
 what:'A chip fresh from the factory knows nothing. The factory writes a program into its flash memory: a list of instructions that says what to do when each button is pressed.',
 tip:'Load the program that turns button presses into TV codes.',fact:['flash memory','keeps the program even when the batteries come out'],
 ctl:{type:'choice',label:'Program',start:-1,opts:[
  {l:'Empty memory',q:.05,m:'With no program, the chip has no idea what a button press means. Nothing happens.'},
  {l:'TV remote program',q:1,m:'Now the chip knows: when a button is pressed, send that button\'s code.'},
  {l:'Microwave timer program',q:.15,m:'That program counts down and beeps. Useful in a kitchen, useless for a TV.'}]}},
{ph:0,id:'sleep',name:'Go to sleep',
 what:'A remote sits unused most of the day. Instead of running all the time, the chip goes into a deep sleep that uses almost no power. Pressing any button sends a signal that wakes it instantly.',
 tip:'A remote spends almost all its life waiting. Pick how it should wait.',fact:['years','how long remote batteries can last, because the chip sleeps'],
 ctl:{type:'choice',label:'While nobody is pressing',start:-1,opts:[
  {l:'Stay awake',q:.2,m:'Staying awake all day drains the batteries in days, not years.'},
  {l:'Sleep, wake on a press',q:1,m:'The chip naps on a trickle of power and wakes the moment a button is pressed.'},
  {l:'Switch off completely',q:.1,m:'The batteries last, but a switched-off chip cannot notice a button press.'}]}},
{ph:0,id:'debounce',name:'Press a button',
 what:'A button is two pieces of metal that touch when pressed. For a few milliseconds they bounce, touching and separating several times. The chip waits for the bouncing to stop before it counts the press, so one press means one press. This is called debouncing.',
 tip:'Wait about 15 milliseconds for the button to settle.',fact:['5 to 20 ms','a typical wait, far quicker than a blink'],
 ctl:S('Wait time after a press','ms',0,50,1,1,15,8,'Too short. The chip counts every bounce, so one press turns the volume up several times.','Too long. The remote feels slow to respond.')},
{ph:0,id:'code',name:'Turn the button into a number',
 what:'Each button has its own number. The chip looks it up and turns it into binary, a row of 1s and 0s, because light can only be on or off.',
 tip:'Pick a button and see the number the chip sends for it.',fact:['8 bits','enough for 256 different buttons'],
 ctl:{type:'choice',label:'Button',start:0,free:true,opts:[
  {l:'Power',b:'power',m:'Power becomes 0 1 0 0 0 1 0 1. Each 1 is a flash of light and each 0 is a pause.'},
  {l:'Volume up',b:'volup',m:'Volume up becomes 0 1 0 0 0 1 1 0. Only the last two bits differ from Power.'},
  {l:'Channel up',b:'chup',m:'Channel up becomes 0 1 0 0 0 0 0 0. These are example codes. Each TV maker picks its own.'}]}},
{ph:1,id:'carrier',name:'Blink at the right speed',
 what:'Sunlight and lamps also give off infrared light, so the TV needs a way to tell the remote apart. The remote flickers its light very fast, usually 38,000 times a second, and the TV\'s receiver only listens to light flickering at that speed.',
 tip:'Most TV receivers listen for light that flickers 38,000 times a second: 38 kHz.',fact:['38 kHz','a common remote-control flicker speed'],
 ctl:S('Flicker speed','kHz',10,100,1,70,38,2,'Too slow. The receiver is tuned to 38 kHz, like a radio on one station, so it ignores this.','Too fast. The receiver is tuned to 38 kHz, like a radio on one station, so it ignores this.')},
{ph:1,id:'led',name:'Power the light',
 what:'The light comes from a small infrared LED at the front of the remote. More current makes a brighter flash that travels further, but drains the battery faster. Each flash lasts a tiny moment, so it can be bright without using much power overall.',
 tip:'The TV is 3 metres away. Give the light enough power to reach it, about 90 mA, without wasting battery.',fact:['940 nm','the usual wavelength of a remote\'s infrared light'],
 ctl:S('LED power','mA',10,250,5,25,90,40,'Too weak. The light fades out before it reaches the TV.','Too strong. It reaches the TV, but drains the batteries and can overheat the LED.')},
{ph:1,id:'color',name:'Choose the right light',
 what:'Remotes use infrared light, just beyond red, which our eyes cannot see. The TV\'s receiver sits behind a dark filter that lets infrared through and blocks most visible light.',
 tip:'Pick the kind of light the remote should send.',fact:['phone camera','many phone cameras can see a remote\'s invisible flash. Try it.'],
 ctl:{type:'choice',label:'Light',start:-1,opts:[
  {l:'Visible red',q:.4,m:'You would see a red flash on every press, and the TV\'s dark filter blocks most of it.'},
  {l:'Infrared',q:1,m:'Invisible to you, clear as day to the TV\'s receiver.'},
  {l:'Ultraviolet',q:.1,m:'TV receivers are not made to see ultraviolet, and it is harder on eyes and skin.'}]}},
{ph:1,id:'aim',name:'Aim at the TV',
 what:'Infrared light travels in straight lines like a torch beam, and it cannot pass through walls, people or cushions. The beam spreads out a little, so the aim does not need to be perfect.',
 tip:'Point the remote at the TV.',fact:['bounce','infrared bounces off walls, which is why pointing at the ceiling sometimes works'],
 ctl:S('Aim','°',-60,60,5,-45,0,15,'Aimed too far left. The light hits the wall instead of the TV.','Aimed too far right. The light hits the wall instead of the TV.')},
{ph:2,id:'codeset',name:'Speak the TV\'s language',
 what:'Every TV maker uses its own codes. A remote that comes with the TV already speaks its language. A universal remote stores many code sets and needs to be told which one matches your TV.',
 tip:'Your TV is Brand B. Pick the matching code set.',fact:['code sets','why universal remotes ask you to type in a number for your TV brand'],
 ctl:{type:'choice',label:'Code set',start:-1,opts:[
  {l:'Set 101 · Brand A',q:.1,m:'Brand B hears this as gibberish and ignores it.'},
  {l:'Set 202 · Brand B',q:1,m:'Same language. The TV understands every button.'},
  {l:'Set 303 · Brand C',q:.1,m:'Brand B hears this as gibberish and ignores it.'}]}},
{ph:2,id:'check',name:'Check the message',
 what:'Sunlight, lamps and distance can garble a bit or two. Many remotes send each number followed by its exact opposite, with every 1 flipped to 0. The TV checks that the two match and ignores the message if they do not, so it never jumps to the wrong channel.',
 tip:'Light can get garbled on the way. Pick how the remote makes sure the TV gets the right message.',fact:['NEC','a common remote format that sends each code followed by its exact opposite'],
 ctl:{type:'choice',label:'How to send it',start:-1,opts:[
  {l:'Send it once',q:.3,m:'One flipped bit and the TV acts on the wrong number, like jumping to the wrong channel.'},
  {l:'Send it, then its opposite',q:1,m:'The TV compares the two halves. A garbled message is caught and ignored.'},
  {l:'Send it ten times',q:.6,m:'It usually gets through, but it is slow and wastes battery.'}]}},
{ph:2,id:'power',name:'Turn on the TV',
 what:'All of it happens in a blink. The chip wakes, reads the button, builds the code, flashes it across the room, and the chip inside the TV checks it and turns the screen on.',
 tip:'Nothing to tune here. Watch the whole journey.',fact:['~68 ms','to send one full button message in the NEC format'],ctl:null}
];
const KID=[
"The chip is like a tiny brain, and batteries are its food. Two batteries stacked together give it just the right amount. Too little and it falls asleep. Too much and it gets a tummy ache.",
"A new chip is like a notebook with empty pages. We write instructions in it: when someone presses this button, send this message. The notebook remembers even when the batteries are out.",
"The chip takes a nap whenever nobody is pressing buttons. When you press one, it wakes up in a flash, does its job, and goes right back to sleep. That is why the batteries last so long.",
"When you press a button, the metal inside bounces like a ball for a tiny moment. If the chip counted every bounce, one press would turn the volume up five times. So it waits until the bouncing stops.",
"Every button has a secret number. The chip turns that number into a pattern of ons and offs, a bit like Morse code with blinks. On means 1 and off means 0.",
"The sun and lamps also make invisible light, so the TV could get confused. To stand out, the remote flickers super fast, like a secret handshake. The TV only listens to light that flickers at exactly that speed.",
"The front of the remote has a tiny light. Give it more power and the light shines further across the room. Give it too much and it gets hot and eats the batteries.",
"The remote uses a colour of light that is invisible to people, just past red in the rainbow. The TV has special eyes that can see it. So the remote is flashing at the TV, and you never notice.",
"The light goes in a straight line, like a flashlight beam. If you point it the wrong way, it hits the wall instead of the TV. It also cannot go through your hand or the dog.",
"Different TVs speak different languages. If the remote speaks the wrong one, the TV just hears gibberish. A universal remote knows lots of languages, so you tell it which one your TV speaks.",
"Sometimes a blink gets lost on the way, like a word in a noisy room. So the remote says the message, then says it again backwards. If the two don't match, the TV knows something went wrong and waits for you to press again.",
"You press one button and the whole chain happens faster than you can blink. The little chip that started as sand just talked to your TV using invisible light."];
STEPS.forEach((s,i)=>s.kid=KID[i]);
const IDX=Object.fromEntries(STEPS.map((s,i)=>[s.id,i])),LAST=STEPS.length-1;
const vals=STEPS.map(s=>!s.ctl?0:s.ctl.start), res=STEPS.map(()=>null);
let cur=0,T=0,t0=0,kid=false;

/* ---------- scoring ---------- */
function score(i){const k=STEPS[i].ctl,v=vals[i];
  if(!k||k.free)return{q:1,cls:'good'};
  if(k.type==='choice'){if(v<0)return{q:1,cls:'warn',none:true};const o=k.opts[v];return{q:o.q,cls:o.q>=.95?'good':'warn',msg:o.m}}
  const d=Math.abs(v-k.ideal);if(d<=k.tol+1e-9)return{q:1,cls:'good',msg:'Well done. Go on to the next step.'};
  const q=Math.max(.15,1-(d-k.tol)/((k.max-k.min)*.45));return{q,cls:'warn',msg:v<k.ideal?k.low:k.high}}
const qOf=i=>res[i]?res[i].q:1, ch=(id,def)=>vals[IDX[id]]<0?def:vals[IDX[id]];
function line(){const I=vals[IDX.led],colorF=[.5,1,.2][ch('color',1)],sl=ch('sleep',1);
  const range=0.45*Math.sqrt(I)*colorF*(qOf(IDX.battery)>=.95?1:.6)*(qOf(IDX.aim)>=.95?1:.5);
  let life=sl===0?.25:sl===2?0:30*Math.min(1.3,Math.sqrt(90/Math.max(I,20)));if(qOf(IDX.battery)<.95)life*=.5;
  const ok=sl===2?0:100*['firmware','debounce','carrier','codeset','check'].reduce((a,k)=>a*qOf(IDX[k]),1);
  return{range,life,ok}}
const fmtLife=m=>m<=0?'never used':m<1?Math.max(1,Math.round(m*30))+' days':m>=12?(m/12).toFixed(1)+' years':Math.round(m)+' months';

/* ---------- canvas helpers ---------- */
const W=640,H=300;let c;

function prange(){const l=line();return P.batt<10?0:l.range*Math.sqrt(P.batt/100)}
function press(b){const rg=prange(),ux=P.dist;let why='';
  if(P.batt<10)why='The battery is flat. Slide the battery back up.';else if(P.hand)why='Your hand blocked the light. Infrared cannot pass through it.';
  else if(rg<ux)why=`Too far. At this battery level your remote reaches ${rg.toFixed(1)} m and the TV is ${ux} m away.`;
  else if(line().ok<50)why='The TV could not understand the code. Fix the red steps in "Step by step".';
  else if(!P.on&&b!=='power')why='The TV is off. Press Power first.';
  P.btn=b;P.flash=performance.now();P.ok=!why;P.stop=P.hand?.45:Math.min(1,rg/ux);
  setTimeout(()=>{if(!P.ok)return;if(b==='power')P.on=!P.on;if(b==='chup')P.ch=P.ch%99+1;if(b==='chdn')P.ch=P.ch>1?P.ch-1:99;if(b==='volup')P.vol=Math.min(30,P.vol+1);if(b==='voldn')P.vol=Math.max(0,P.vol-1);if(b.startsWith('vol'))P.volShow=performance.now()},450);
  const st=$('#pstatus');st.className='status'+(why?'':' good');st.innerHTML=why?`<b>The TV didn't respond</b>${why}`:`<b>✓ ${NAMES[b]} sent: ${CODES[b]}</b>The TV received it and checked it.`}
function draw2(now){c=ctx2;R(0,0,W,H,'#0e1233');const px=55,tvx=470,rx=tvx-P.dist*px;
  LN(20,262,620,262,DIM,1);for(let m=0;m<=8;m+=2)TX(m+' m',tvx-m*px,280,DIM,11,'center');
  tv(tvx,60,150,110,{on:P.on,hue:(P.ch*47)%360,rx:P.flash>0&&now-P.flash<500&&P.ok,label:P.on?'CH '+P.ch:''});
  if(P.on&&now-P.volShow<1500){R(tvx+20,150,110,6,'#0e1233');R(tvx+20,150,110*P.vol/30,6,'#fff')}
  const ft=P.flash>0?(now-P.flash)/450:2,lit=ft<1;remote(rx-20,120,{s:.5,lit,hl:lit?P.btn:null});
  if(lit){const x2=L(rx,tvx,P.stop);beam(rx,118,x2,115,Math.min(ft,1)*1,IR,true)}
  if(P.hand){const hx=L(rx,tvx,.45);RR(hx-14,70,28,90,12,'#e7b08a');for(let i=0;i<4;i++)RR(hx-14+i*7,52,6,26,3,'#e7b08a')}
  const b=P.batt;RR(24,22,44,20,4,'#3a4060');RR(27,25,38*b/100,14,2,b<10?RED:b<30?AMB:GRN);R(68,27,4,10,'#3a4060');TX(b+'%',78,37,INK,12);
  TX('remote reaches '+prange().toFixed(1)+' m',616,36,DIM,12,'right')}
function syncP(){P.dist=+$('#p-dist').value;P.batt=+$('#p-batt').value;P.hand=$('#p-hand').checked;$('#o-dist').textContent=P.dist+' m';$('#o-batt').textContent=P.batt+'%';
  $('#pnote').textContent=`This remote uses your settings from "Step by step": it reaches ${line().range.toFixed(1)} m on full batteries and ${Math.round(line().ok)}% of its codes are understood.`}
$('#view-play').addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(b)press(b.dataset.b)});
$('#view-play').addEventListener('input',syncP);$('#view-play').addEventListener('change',syncP);

/* ---------- shell ---------- */
function tab(t){['build','play'].forEach(k=>{$('#view-'+k).hidden=k!==t;$('#tab-'+k).setAttribute('aria-pressed',k===t)});if(t==='play')syncP();fitC(t==='play'?cv2:cv)}
['build','play'].forEach(k=>$('#tab-'+k).addEventListener('click',()=>tab(k)));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){if(!$('#view-build').hidden){T=RM||now<t0?1:Math.min(1,((now-t0)%4400)/3000);draw()}else draw2(now);requestAnimationFrame(loop)}
addEventListener('resize',()=>{fitC(cv);fitC(cv2)});
fitC(cv);fitC(cv2);go(0);syncP();requestAnimationFrame(loop);
</script>
